name: Development builds

concurrency:
  group: devbuilds
  cancel-in-progress: true
  
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Install native dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev g++-mingw-w64-x86-64 g++-mingw-w64-i686 cmake ninja-build
    - name: Build
      run: PACKAGESUFFIX=-nightly-$GITHUB_RUN_NUMBER ./build-nuget.sh win_x86 win_x64 linux_x64 managed
    - name: Publish Nuget to GitHub registry
      run: dotnet nuget push ./build/nuget/package/release/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/CallumDev/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  buildmac_arm:
    runs-on: macos-15
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Build
      run: PACKAGESUFFIX=-nightly-$GITHUB_RUN_NUMBER ./build-nuget.sh osx_arm64
    - name: Publish Nuget to GitHub registry
      run: dotnet nuget push ./build/nuget/package/release/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/CallumDev/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  buildmac_x64:
    runs-on: macos-15-intel
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Build
      run: PACKAGESUFFIX=-nightly-$GITHUB_RUN_NUMBER ./build-nuget.sh osx_x64
    - name: Publish Nuget to GitHub registry
      run: dotnet nuget push ./build/nuget/package/release/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/CallumDev/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
